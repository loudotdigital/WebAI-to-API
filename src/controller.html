<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Controller</title>
    <style>
        body { font-family: sans-serif; padding: 2em; }
        .status { padding: 1em; border-radius: 5px; margin-bottom: 1em; }
        .running { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .stopped { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        button { padding: 0.5em 1em; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WebAI-to-API Server Controller</h1>
    
    <div id="status-container">
        <!-- Status will be loaded here by JavaScript -->
        <p>Loading status...</p>
    </div>

    <script>
        async function fetchStatus() {
            const response = await fetch('/controller/status');
            const data = await response.json();
            
            const container = document.getElementById('status-container');
            container.innerHTML = `
                <div class="status ${data.current_mode === 'webai' ? 'running' : 'stopped'}">
                    <strong>WebAI Server (Primary)</strong>: ${data.current_mode === 'webai' ? 'RUNNING' : 'STOPPED'}
                    <p>Available: ${data.webai_available ? '✅ Yes' : '❌ No'}</p>
                    ${data.current_mode !== 'webai' && data.webai_available ? '<button onclick="switchServer(\'webai\')">Start WebAI Server</button>' : ''}
                </div>
                <div class="status ${data.current_mode === 'g4f' ? 'running' : 'stopped'}">
                    <strong>g4f Server (Fallback)</strong>: ${data.current_mode === 'g4f' ? 'RUNNING' : 'STOPPED'}
                    <p>Available: ${data.g4f_available ? '✅ Yes' : '❌ No'}</p>
                    ${data.current_mode !== 'g4f' && data.g4f_available ? '<button onclick="switchServer(\'g4f\')">Start g4f Server</button>' : ''}
                </div>
            `;
        }

        async function switchServer(mode) {
            await fetch(`/controller/switch/${mode}`, { method: 'POST' });
            // After sending the switch command, refresh the status after a short delay
            setTimeout(fetchStatus, 2000); // 2-second delay to allow server to restart
        }

        // Fetch status on page load and then every 5 seconds
        document.addEventListener('DOMContentLoaded', () => {
            fetchStatus();
            setInterval(fetchStatus, 5000);
        });
    </script>
</body>
</html>
